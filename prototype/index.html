<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pushpa">
  <title>PUSHPA — Train. Track. Burn.</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div id="app-viewport">
    <div class="app-shell" id="app-shell">
      
      <!-- App Header: Flex Row with min-height 56px + safe-area -->
      <header class="app-header" id="app-header">
        <div class="app-header__left" id="header-left"></div>
        <div class="app-header__right" id="header-right"></div>
      </header>

      <!-- Main Content Area: Exactly ONE Screen Mounted -->
      <main class="app-content" id="app-content" role="main"></main>

      <!-- Bottom Navigation: Strict Grid -->
      <nav class="app-nav" id="main-nav" role="navigation" aria-label="Main Navigation"></nav>

    </div>

    <!-- Overlay Root: Sheets, Modals, Toasts, Intro ONLY -->
    <div id="overlay-root"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
